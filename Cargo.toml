[package]
name = "vuzt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
egui = "0.32"
egui-android = { git = "https://github.com/sagebind/egui-android" }
android-activity = "0.6"
log = "0.4"
android_logger = "0.15"
egui_plot = "0.32"
rand = "0.8"

[package.metadata.android]
package = "com.cak.vuzt"
label = "Vuzt"
build_targets = ["aarch64-linux-android"]
target_sdk_version = 30
min_sdk_version = 21

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"

[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"
key_alias = "androiddebugkey"
key_password = "android"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
